<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>templates/post/list.html</title>
</head>
<body>
	<div class="container">
		<a href="/post/new">새글 작성</a>
		<h3>글 목록 입니다</h3>
		<table border="1">
			<thead>
				<tr>
					<th>번호</th>
					<th>작성자</th>
					<th>제목</th>
					<th>내용</th>
					<th>작성일</th>
					<th>수정</th>
					<th>삭제</th>
				</tr>
			</thead>
			<tbody>
				{% for post in posts %}
				<tr>
					<td>{{ post.num }}</td>
					<td>{{ post.writer }}</td>
					<td>{{ post.title }}</td>
					<td>{{ post.content }}</td>
					<td>{{ post.created_at }}</td>
					<td>
						<a href="/post/edit/{{ post.num }}">수정</a>
					</td>
					<td>
				        <form action="/post/delete" method="post">
				            <input type="hidden" name="num" value="{{ post.num }}">
				            <button type="submit">삭제</button>
				        </form>
					</td>
				</tr>
				{% endfor %}
			</tbody>
		</table>
		<br>
		<a href="/">홈으로 돌아가기</a>
	</div>
</body>
</html>
